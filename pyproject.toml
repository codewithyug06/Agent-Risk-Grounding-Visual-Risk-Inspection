[project]
name = "agent-risk-grounding-visual-risk-inspection"
version = "0.1.0"
description = "Agent Risk Grounding & Visual Risk Inspection: Real-Time Visual Safety Monitoring for Computer-Use AI Agents via Temporal Risk Detection and UI Element Grounding"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Yugendhar Reddy Bommula", email = "codewithyug06@gmail.com"}
]
urls = {Homepage = "https://github.com/codewithyug06/Agent-Risk-Grounding-Visual-Risk-Inspection", Repository = "https://github.com/codewithyug06/Agent-Risk-Grounding-Visual-Risk-Inspection"}
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Image Recognition",
]
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "timm>=0.9.0",
    "transformers>=4.30.0",
    "datasets>=2.14.0",
    "huggingface_hub>=0.16.0",
    "playwright>=1.40.0",
    "selenium>=4.10.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "hydra-core>=1.3.0",
    "omegaconf>=2.3.0",
    "wandb>=0.15.0",
    "onnx>=1.14.0",
    "onnxruntime>=1.15.0",
    "onnxscript>=0.1.0",  # required by torch.onnx.export on current torch/onnx versions
    "opencv-python>=4.8.0",  # not headless: LiveMonitorGUI uses cv2.imshow/namedWindow
    "Pillow>=10.0.0",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "trl>=0.7.0",
    "peft>=0.5.0",
    "accelerate>=0.21.0",
    "scikit-learn>=1.3.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "mss>=9.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.21.0",
    "ruff>=0.1.0",
]
# Desktop tray app runtime. Kept separate from the base install so the
# gateway/training deps (torch, timm, transformers, ...) aren't required
# just to run the packaged always-on monitor, which uses the ONNX INT8
# export path instead of full PyTorch.
desktop = [
    "pystray>=0.19.5",
    "plyer>=2.1.0",
    "onnxruntime>=1.15.0",
    "mss>=9.0.0",
    "pyinstaller>=6.0.0",
]

[project.scripts]
sentinel-wall = "src.security_wall.cli:main"
sentinel-guard = "src.security_wall.cli:main"

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.black]
line-length = 100
target-version = ['py310']
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3

[tool.ruff]
line-length = 100
target-version = "py310"
select = ["E", "F", "I", "UP", "W"]
ignore = ["E501", "B008"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
namespace_packages = true