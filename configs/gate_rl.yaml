defaults:
  - model_small
  - data
  - _self_

algorithm: "PPO"

reward:
  correct_allow: 1.0
  false_block: -1.0
  missed_harm: -10.0
  correct_pause: 0.5
  correct_block: 2.0

ppo:
  learning_rate: 1.0e-5
  batch_size: 32
  n_epochs: 4
  clip_epsilon: 0.2
  gamma: 0.99
  gae_lambda: 0.95
  ent_coef: 0.01
  vf_coef: 0.5
  max_grad_norm: 0.5

gate_actions:
  - "ALLOW"
  - "PAUSE"
  - "HARD_BLOCK"

state_dim: 8
hidden_dim: 128
num_actions: 3

sentinel_checkpoint: "checkpoints/stage_c/best.pt"
checkpoint_dir: "checkpoints/gate_rl"
device: "cuda"

training:
  total_timesteps: 5000
  eval_freq: 1000
  save_freq: 2500
  batch_size: 16
  num_workers: 0