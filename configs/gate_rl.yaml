algorithm: "PPO"

reward:
  correct_allow: 1.0
  false_block: -1.0
  missed_harm: -10.0
  correct_pause: 0.5
  correct_block: 2.0

ppo:
  learning_rate: 1.0e-5
  batch_size: 32
  n_epochs: 4
  clip_epsilon: 0.2
  gamma: 0.99
  gae_lambda: 0.95
  ent_coef: 0.01
  vf_coef: 0.5
  max_grad_norm: 0.5

gate_actions:
  - "ALLOW"
  - "PAUSE"
  - "HARD_BLOCK"

state_dim: 8
hidden_dim: 128
num_actions: 3

training:
  total_timesteps: 100000
  eval_freq: 10000
  save_freq: 20000
  n_envs: 4