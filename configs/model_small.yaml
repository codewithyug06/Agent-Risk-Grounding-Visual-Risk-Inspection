defaults:
  - data
  - _self_

backbone: "vit_small_patch16_224"
pretrained: true
freeze_backbone_epochs: 3

temporal:
  num_heads: 8
  num_layers: 3
  dropout: 0.1
  max_frames: 8

risk_head:
  hidden_dim: 256
  num_categories: 5

refiner:
  enabled: true
  hidden: 256
  pool: 7
  num_proposals: 30
  nms_iou: 0.5
  jitter_copies: 6
  jitter_frac: 0.15

localization:
  anchor_sizes: [8, 16, 32, 64]
  iou_threshold: 0.5

training:
  batch_size: 8
  gradient_accumulation_steps: 2
  learning_rate: 3e-4
  weight_decay: 1e-4
  epochs: 35
  warmup_epochs: 3
  gradient_clip: 1.0
  mixed_precision: true
  num_workers: 0

seed: 42
device: "cuda"
resume_from: null
num_epochs: null
continuation_lr: 5.0e-5