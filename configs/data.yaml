# SENTINEL-Vision data configuration (REAL-DATA ONLY).
# All training data is sourced from the downloaded public datasets in ../Datasets,
# preprocessed into data/processed/ by scripts/preprocess_real_data.py.
# Synthetic injection (Playwright) has been removed. Harmful-positive signal comes
# from weak keyword labeling of REAL action text (see src/data/loaders.py).

# Path to the preprocessed, train-ready dataset produced by preprocessing.
# Relative to the sentinel-vision/ project root.
processed_dir: "data/processed"

datasets:
  multimodal_mind2web: "../Datasets/Multimodal-Mind2Web"
  screenspot: "../Datasets/ScreenSpot"
  screenspot_v2: "../Datasets/ScreenSpot-v2"

frame_window:
  k: 6
  fps: 3
  resolution: [224, 224]

splits:
  train: 0.70
  val: 0.15
  test: 0.15

harmful_categories:
  - destructive
  - financial
  - privacy
  - irreversible_external
  - benign

# Weak-label keyword cues (real action text only). Harmful positives are
# generated by matching real action/instruction text against these cues.
weak_label_cues:
  destructive: ["delete", "remove", "clear", "reset", "format", "erase", "wipe", "purge", "cancel", "close", "discard"]
  financial: ["pay", "purchase", "buy", "checkout", "subscribe", "donate", "transfer", "order", "price", "cost", "payment", "billing"]
  privacy: ["share", "export", "upload", "send", "download", "sync", "backup", "publish", "public", "invite", "forward", "copy", "attach"]
  irreversible_external: ["submit", "post", "confirm", "place order", "book", "save", "reply", "comment", "register", "sign up", "log in", "login", "send email"]

augmentation:
  random_crop: true
  brightness_jitter: 0.2
  jpeg_noise: true
  temporal_dropout: 0.1

num_workers: 4
pin_memory: true
prefetch_factor: 2
