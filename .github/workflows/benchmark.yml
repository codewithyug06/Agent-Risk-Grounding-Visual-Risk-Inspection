name: Weekly Benchmark

on:
  schedule:
    - cron: "0 2 * * 0"  # Every Sunday 2 AM UTC
  workflow_dispatch:

jobs:
  full-benchmark:
    name: Model Evaluation & Ablation Suite
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MPLBACKEND: Agg
      QT_QPA_PLATFORM: offscreen
      PYTHONPATH: .

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install PyTorch (CPU) & Core Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision --extra-index-url https://download.pytorch.org/whl/cpu
          pip install timm onnx onnxruntime opencv-python-headless pillow fastapi uvicorn pydantic hydra-core omegaconf wandb tqdm numpy pandas scikit-learn matplotlib seaborn mss pytest pytest-cov pytest-asyncio
          pip install -e . --no-deps

      - name: Run Full Test Suite
        run: |
          python -m pytest tests/ -v --tb=short

      - name: Generate Research Reports
        run: |
          python scripts/generate_research_reports.py
        env:
          WANDB_MODE: disabled

      - name: Upload benchmark artifacts
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-artifacts
          path: |
            paper/benchmark_tables/
            paper/figures/
            reports/