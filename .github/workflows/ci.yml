name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MPLBACKEND: Agg
      QT_QPA_PLATFORM: offscreen
      PYTHONPATH: .

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install PyTorch (CPU) & Core Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision --extra-index-url https://download.pytorch.org/whl/cpu
          pip install timm datasets transformers onnx onnxruntime opencv-python-headless pillow fastapi uvicorn pydantic hydra-core omegaconf wandb tqdm numpy pandas scikit-learn matplotlib seaborn mss pytest pytest-cov pytest-asyncio
          pip install -e . --no-deps

      - name: Run Test Suite (122 Tests)
        run: |
          python -m pytest tests/ -v --tb=short

      - name: Verify CLI Tools
        run: |
          python -m src.security_wall.cli --help